apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Removing all files from $(workspaces.source.path) ..."
        find "$(workspaces.source.path)" -mindepth 1 -delete || true
        echo "Cleanup complete."
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --user flake8
        export PATH="$HOME/.local/bin:$PATH"
        flake8 app.py tests --count --max-complexity=10 --max-line-length=127 --statistics
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to nosetests
      type: string
      default: "-v"
  steps:
    - name: nosetests
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --user -r requirements.txt -r requirements-dev.txt
        export PATH="$HOME/.local/bin:$PATH"
        nosetests $(params.args)
