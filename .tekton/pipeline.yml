apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oc-final
spec:
  params:
    - name: repo-url
      type: string
      description: Git repository URL for the application
    - name: branch
      type: string
      default: main
  workspaces:
    - name: pipeline-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      workspaces:
        - name: output
          workspace: pipeline-workspace

    - name: flake8
      runAfter: [git-clone]
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: nose
      runAfter: [flake8]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: pipeline-workspace
